<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedidos Recebidos | Ultragaz</title>
  <!-- Troque pelo nome do SEU arquivo CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="pagina-pedidos">

  <header>
  <a class="logo" href="../index.html">Ultragaz</a>
  <nav>
    <a href="../index.html">Início</a>
    <a href="pedidos.html" class="ativo">Pedidos</a>
    <a href="../contato" class="botao">Peça Seu Gás</a>
  </nav>
</header>

  <main>
    <div class="topo">
      <div>
        <h1>Pedidos Recebidos</h1>
        <p class="contador" id="contador"></p>
      </div>
      <button class="btn btn-novo" id="btnNovo" type="button">Novo pedido</button>
    </div>

    <div class="tabela-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Telefone</th>
            <th>Endereço</th>
            <th>Produto</th>
            <th>Qtd</th>
            <th>Mensagem</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </main>

  <dialog id="modal">
    <h2 id="tituloModal">Novo pedido</h2>
    <form id="form" method="dialog">
      <label>Nome
        <input type="text" id="nome" required maxlength="80">
      </label>

      <label>Telefone
        <input type="tel" id="telefone" required placeholder="(19) 99999-9999" maxlength="15">
      </label>

      <label>CEP
        <input type="text" id="cep" required placeholder="00000-000" maxlength="9" inputmode="numeric">
        <small id="cepStatus" class="status" aria-live="polite"></small>
      </label>

      <div class="linha linha-rua">
        <label>Rua
          <input type="text" id="rua" required maxlength="100">
        </label>
        <label>Número
          <input type="text" id="numero" required maxlength="10">
        </label>
      </div>

      <div class="linha linha-cidade">
        <label>Bairro
          <input type="text" id="bairro" required maxlength="60">
        </label>
        <label>Cidade
          <input type="text" id="cidade" required maxlength="60">
        </label>
        <label>UF
          <input type="text" id="uf" required maxlength="2">
        </label>
      </div>

      <div class="linha linha-produto">
        <label>Produto
          <input type="text" id="produto" required list="produtos" maxlength="60">
          <datalist id="produtos">
            <option value="Botijão P13 (13 kg)  R$134,00">
            <option value="Botijão P20 (20 kg)  R$245,00">
            <option value="Botijão P45 (45 kg)  R$480,00">
          </datalist>
        </label>
        <label>Qtd
          <input type="number" id="qtd" required min="1" value="1">
        </label>
      </div>

      <label>Mensagem
        <textarea id="mensagem" maxlength="300" placeholder="Complemento, horário, observações..."></textarea>
      </label>

      <div class="botoes">
        <button type="button" class="btn btn-cancelar" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn btn-salvar">Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- Troque pelo nome do SEU arquivo JS -->
  <script src="../js/script.js"></script>
</body>
</html>
